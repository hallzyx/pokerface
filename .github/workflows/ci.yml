name: ci

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: verificar
        run: make verificar
